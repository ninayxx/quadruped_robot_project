; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
upload_port = /dev/cu.usbserial-ABBIOY13
monitor_speed = 9600
lib_deps = 
	arduino-libraries/Servo
	paulstoffregen/FlexiTimer2
	kroimon/SerialCommand
    robtillaart/PCA9685

[env:robot]
build_src_filter = +<*> -<blink.cpp>
lib_deps = 
	arduino-libraries/Servo
	paulstoffregen/FlexiTimer2
    robtillaart/PCA9685

[env:blink]
build_src_filter = -<*> +<testing/blink.cpp>

[env:i2c_scan]
build_src_filter = -<*> +<testing/i2c_scan.cpp>

[env:servo]
build_src_filter = -<*> +<testing/servo.cpp>
lib_deps = 
    robtillaart/PCA9685
